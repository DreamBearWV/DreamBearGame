name: Deploy DreamBearGame to Raspberry Pi

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted  # 指定在樹莓派上執行

    steps:
      - name: 拉取最新代碼
        uses: actions/checkout@v4

      - name: 部署 Node.js 後端
        run: |
          cd backend
          npm install --production
          pm2 restart game-backend

      - name: 部署前端 Web 檔案至 Nginx
        run: |
          sudo mkdir -p /var/www/dreambear-game
          if [ -d "frontend" ] && [ "$(ls -A frontend)" ]; then
            sudo cp -r frontend/* /var/www/dreambear-game/
            sudo chown -R $USER:$USER /var/www/dreambear-game
          fi